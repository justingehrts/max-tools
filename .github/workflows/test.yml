name: Tests

# Runs the unit tests on every push and pull request. Never deploys anything.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install matplotlib jsonschema numpy scipy requests markdown
      - name: Registry is valid
        run: python tools/registry.py
      - name: Configurator library tests
        run: node configurator/test_lib.js
      - name: PHP version
        run: php -v
      - name: PHP endpoint library tests
        run: php tests/php/test_lib.php
      - name: Unit tests (includes the endpoint end-to-end test under php -S)
        run: python -m unittest discover -v tests
