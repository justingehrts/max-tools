name: Build record dot KMZs

on:
  schedule:
    - cron: '20 * * * *'   # 20 minutes past every hour
  workflow_dispatch:       # lets you (and later the configurator endpoint) run it by hand
  push:
    branches: [main]
    paths:
      - 'records/**'
      - 'tools/**'
      - 'schema/**'
      - 'configs.json'
      - 'markets.json'
      - '.github/workflows/records.yml'

permissions:
  contents: write          # only used to save newly learned NOAA stations back to records/stations.csv
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      NWS_CONTACT: ${{ vars.NWS_CONTACT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the National Weather Service contact address is set
        run: |
          if [ -z "$NWS_CONTACT" ]; then
            echo "::error::Add a repository variable named NWS_CONTACT (Settings > Secrets and variables > Actions > Variables) with a shared weather-team email address. NWS asks automated tools to identify an owner."
            exit 1
          fi

      - name: Write config for the script
        run: |
          mkdir -p site/records/default /tmp/navdata
          jq -n --arg email "$NWS_CONTACT" --arg kml "$PWD/site/records/default" \
            '{station:{name:"MaxTools",contactEmail:$email},recordDots:{kmlFolder:$kml,navDataFolder:"/tmp/navdata"}}' > records/config.json

      - name: Fetch NOAA lists and build the default KMZs
        shell: pwsh
        working-directory: records
        run: ./FetchDailyRecords.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install matplotlib jsonschema

      - name: Build each station's styled copy
        run: python tools/build_record_styles.py --site site --run-log records/run_log.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Save newly learned NOAA stations
        run: |
          if ! git diff --quiet -- records/stations.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add records/stations.csv
            git commit -m "Learn new NOAA stations"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Fail the run if any registry entry was skipped
        run: |
          # The site is already deployed; this only turns the run red so the problem gets noticed.
          n=$(jq '[.styles[] | select(.status=="skipped")] | length' site/records/status.json)
          if [ "$n" -gt 0 ]; then
            echo "::error::$n registry entr(y/ies) were skipped. See the warnings above."
            exit 1
          fi
